<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Log Inspector</title>
<style>
:root{
  --bg:#0b0f16;--bg2:#111722;--bg3:#161e2b;--bg4:#1b2534;
  --border:#212b3a;--border2:#2c3849;
  --text:#d7e0ea;--muted:#7b8a9e;--dim:#5a6779;
  --accent:#4c9aff;--green:#3fb950;--orange:#d29922;--red:#f85149;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#263141;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#35455c}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:linear-gradient(180deg,#121a26,#0e141d);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.brand small{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.stats{display:flex;gap:8px;margin-left:6px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 11px;display:flex;flex-direction:column;line-height:1.25;min-width:64px}
.stat b{font-size:14px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat.ok b{color:var(--green)}.stat.warn b{color:var(--orange)}.stat.err b{color:var(--red)}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px 8px 32px;border-radius:8px;width:220px;font-size:13px;outline:none;transition:.15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,154,255,.13);width:260px}
.search svg{position:absolute;left:10px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.select-wrap{position:relative;display:flex;align-items:center}
.select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 30px 8px 12px;border-radius:8px;font-size:13px;outline:none;font-family:var(--sans);cursor:pointer;min-width:170px;max-width:220px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237b8a9e' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center;background-size:14px;transition:.15s}
.select:hover{border-color:var(--border2)}
.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,154,255,.13)}
.select option{background:var(--bg3);color:var(--text)}
.filters{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px}
.filters button{background:none;border:none;color:var(--muted);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--sans);transition:.12s;font-weight:500}
.filters button:hover{color:var(--text)}
.filters button.active{background:var(--bg4);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:var(--sans);transition:.13s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg4);border-color:var(--border2)}
.main{display:grid;grid-template-columns:400px 1fr;overflow:hidden;min-height:0}
.list{overflow-y:auto;border-right:1px solid var(--border);background:var(--bg2)}
.list-head{position:sticky;top:0;z-index:5;background:rgba(17,23,34,.92);backdrop-filter:blur(10px);padding:9px 14px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.item{padding:10px 14px 11px;border-bottom:1px solid #17202c;cursor:pointer;border-left:2px solid transparent;transition:background .1s;position:relative}
.item:hover{background:#151d29}
.item.sel{background:#16202f;border-left-color:var(--accent)}
.item .r1{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.item .time{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
.item .title{font-size:13px;font-weight:600;color:#dbe6f2;letter-spacing:.1px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .path{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.item .r3{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.item .r3 .dur{margin-left:auto}
.item .r3 .sz{color:#4a5666}
.m{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:4px;line-height:1.5;background:#1e2937;color:#94a3b8;border:1px solid #2a3648;min-width:44px;text-align:center}
.m.GET{background:rgba(63,185,80,.12);color:#4ade80;border-color:rgba(63,185,80,.3)}
.m.POST{background:rgba(210,153,34,.13);color:#fbbf24;border-color:rgba(210,153,34,.32)}
.m.PUT{background:rgba(76,154,255,.13);color:#60a5fa;border-color:rgba(76,154,255,.32)}
.m.DELETE{background:rgba(248,81,73,.13);color:#f87171;border-color:rgba(248,81,73,.32)}
.m.PATCH{background:rgba(163,113,247,.13);color:#c084fc;border-color:rgba(163,113,247,.32)}
.s{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;line-height:1.55;background:#1e2937;color:#94a3b8}
.s.ok{background:rgba(63,185,80,.13);color:#4ade80}
.s.redirect{background:rgba(76,154,255,.13);color:#60a5fa}
.s.warn{background:rgba(210,153,34,.14);color:#fbbf24}
.s.err{background:rgba(248,81,73,.14);color:#f87171}
.s.net{background:rgba(163,113,247,.15);color:#c084fc}
.detail{overflow-y:auto;background:var(--bg);min-width:0}
.dhead{padding:18px 22px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#101724,#0b0f16)}
.dtitle{font-size:16px;font-weight:600;color:#e6edf5;margin-bottom:8px;letter-spacing:.1px}
.durl{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.durl .m{margin-top:1px;flex-shrink:0}
.durl .u{font-family:var(--mono);font-size:13.5px;line-height:1.55;word-break:break-all;color:#dbe6f2}
.durl .u .host{color:var(--muted)}
.durl .u .path{color:#e6edf5}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding-left:2px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.ok{color:#4ade80;border-color:rgba(63,185,80,.3);background:rgba(63,185,80,.08)}
.chip.warn{color:#fbbf24;border-color:rgba(210,153,34,.3);background:rgba(210,153,34,.08)}
.chip.err{color:#f87171;border-color:rgba(248,81,73,.3);background:rgba(248,81,73,.08)}
.chip.net{color:#c084fc;border-color:rgba(163,113,247,.3);background:rgba(163,113,247,.08)}
.chip.redirect{color:#60a5fa;border-color:rgba(76,154,255,.3);background:rgba(76,154,255,.08)}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--border);background:#0e141d;position:sticky;top:0;z-index:8}
.tabs button{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:13px;padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;transition:.13s;font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--mono);font-size:10px;background:var(--bg4);padding:1px 6px;border-radius:999px;margin-left:6px;color:var(--muted)}
.pane{display:none;padding:20px 22px 60px}
.pane.active{display:block}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sec-h h3{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h .line{flex:1;height:1px;background:var(--border)}
.copy{background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-size:10.5px;padding:3px 9px;border-radius:6px;cursor:pointer;font-family:var(--sans);transition:.13s}
.copy:hover{color:var(--text);border-color:var(--border2);background:var(--bg4)}
.hdrs{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.hdrs .row{display:grid;grid-template-columns:minmax(120px,220px) 1fr;border-bottom:1px solid #182130}
.hdrs .row:last-child{border-bottom:none}
.hdrs .row:hover{background:#141c28}
.hk{font-family:var(--mono);font-size:12px;color:#8ab4f8;padding:8px 12px;border-right:1px solid #182130;word-break:break-word;background:rgba(20,28,40,.4)}
.hv{font-family:var(--mono);font-size:12px;color:#b8c6d6;padding:8px 12px;word-break:break-all;white-space:pre-wrap}
.code-wrap{position:relative;background:#0d131c;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.code-wrap .cw-head{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#111926;border-bottom:1px solid var(--border);font-size:11px;color:var(--dim);font-family:var(--mono)}
.code-wrap .cw-head .copy{margin-left:auto}
pre.code{font-family:var(--mono);font-size:12.3px;line-height:1.65;color:#c9d5e3;padding:14px 16px;overflow:auto;max-height:520px;white-space:pre;tab-size:2}
pre.code.plain{white-space:pre-wrap;word-break:break-word}
.tok-k{color:#79c0ff}.tok-s{color:#a5d6ff}.tok-n{color:#f0883e}.tok-b{color:#d2a8ff}.pun{color:#6e7d8f}
.form-line{font-family:var(--mono);font-size:12.5px;padding:6px 14px;border-bottom:1px solid #182130;display:grid;grid-template-columns:minmax(90px,180px) 1fr;gap:10px}
.form-line:last-child{border-bottom:none}
.form-line .fk{color:#8ab4f8;word-break:break-all}
.form-line .fv{color:#c9d5e3;word-break:break-all}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:12px;text-align:center;padding:40px}
.empty svg{width:46px;height:46px;stroke:#2c3849;fill:none;stroke-width:1.4}
.empty h2{font-size:15px;color:var(--muted);font-weight:500}
.empty p{font-size:12.5px;max-width:340px;line-height:1.65}
.muted{color:var(--dim);font-size:12px;font-style:italic;padding:4px 2px}
#drop{position:fixed;inset:0;background:rgba(11,15,22,.94);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#drop.on{display:flex}
#drop .box{border:2px dashed var(--accent);border-radius:18px;padding:60px 80px;text-align:center;background:rgba(76,154,255,.05)}
#drop .box h2{font-size:20px;margin-bottom:8px;color:#fff}
#drop .box p{color:var(--muted);font-size:13px}
@media (max-width:1100px){.search input{width:160px}.search input:focus{width:200px}.select{min-width:140px}}
@media (max-width:900px){.main{grid-template-columns:1fr}.list{display:none}.list.show{display:block}}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><div>Network Log Inspector<br><small>Hamrah Baam · iOS</small></div></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search URL, title, host…">
    </div>
    <div class="select-wrap">
      <select id="titleFilter" class="select" title="Filter by request title">
        <option value="">All titles</option>
      </select>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="ok">2xx</button>
      <button data-f="warn">4xx</button>
      <button data-f="err">5xx</button>
      <button data-f="net">Errors</button>
      <button data-f="slow">Slow</button>
    </div>
    <button class="btn" id="loadBtn">📂 Open file</button>
    <input type="file" id="file" accept=".txt,.log,text/plain" hidden>
  </header>
  <div class="main">
    <aside class="list" id="list"></aside>
    <section class="detail" id="detail"></section>
  </div>
</div>

<div id="drop"><div class="box"><h2>Drop your log file</h2><p>Release to parse &nbsp;·&nbsp; All-logs.txt</p></div></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function highlightJSON(json){
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(json))){
    out += esc(json.slice(last, m.index));
    if (m[1]){
      if (m[2]) out += '<span class="tok-k">'+esc(m[1])+'</span><span class="pun">'+esc(m[2])+'</span>';
      else      out += '<span class="tok-s">'+esc(m[1])+'</span>';
    } else if (m[3]) out += '<span class="tok-b">'+m[3]+'</span>';
    else             out += '<span class="tok-n">'+m[4]+'</span>';
    last = re.lastIndex;
  }
  out += esc(json.slice(last));
  return out;
}

function tryJSON(text){
  const t = String(text||'').trim();
  if (!t || !/^[\[{]/.test(t)) return null;
  try { return JSON.parse(t); } catch(e){ return null; }
}
function statusClass(s){
  if (/^2/.test(s)) return 'ok';
  if (/^3/.test(s)) return 'redirect';
  if (/^4/.test(s)) return 'warn';
  if (/^5/.test(s)) return 'err';
  return 'net';
}
function statusCode(s){ const m = String(s).match(/^(\d{3})/); return m ? m[1] : String(s).split(' ')[0]; }
function durMs(d){ const m = String(d||'').match(/([\d.]+)\s*(ms|s)\b/); if (!m) return 0; return m[2]==='s' ? parseFloat(m[1])*1000 : parseFloat(m[1]); }
function fmtDur(d){ if (!d) return '—'; const ms = durMs(d); if (!ms) return d; return ms >= 1000 ? (ms/1000).toFixed(2)+' s' : Math.round(ms)+' ms'; }
function shortPath(url){ try { const u = new URL(url); return u.pathname + (u.search||''); } catch(e){ return url; } }
function hostOf(url){ try { return new URL(url).host; } catch(e){ return ''; } }

/* ---------- Title derivation ---------- */
const GENERIC_SEG = new Set(['api','resources','hambaam-gateway','hambaam','gateway','rest','service','services','external','internal','proxy','public','private','rpc','data']);

function prettifySeg(s){
  return String(s)
    .replace(/[_-]+/g, ' ')
    .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
    .split(/\s+/).filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

function titleOf(url){
  if (!url) return '—';
  let pathname = '';
  try { pathname = new URL(url).pathname; }
  catch(e){ pathname = String(url).split('?')[0]; }

  const segs = pathname.split('/').filter(Boolean).filter(s => !/^v\d+$/i.test(s));
  const meaningful = segs.filter(s => !GENERIC_SEG.has(s.toLowerCase()));
  const picked = (meaningful.length ? meaningful : segs).slice(-2);

  if (!picked.length) return hostOf(url) || shortPath(url) || '—';
  return picked.map(prettifySeg).join(' · ');
}

/* ---------- Parser ---------- */
const SEP = /^[\u2013\u2014-]{5,}$/;
const START = /^(\d{1,2}:\d{2}:\d{2}\.\d{1,3})\s*·\s*([A-Za-z]+)\s*·\s*(.+)$/;

function parseEntry(lines, id){
  const h = lines[0].trim().match(START);
  const e = {
    id, time: h[1], method: h[2].toUpperCase(),
    status:'', size:'', duration:'', url:'', task:'', meta:{},
    title:'', reqHeaders:[], resHeaders:[], reqBody:'', reqBodyLabel:'', resBody:'', error:null
  };

  let rest = h[3].split(' · ');
  if (rest.length > 1 && /\d\s*(ms|s)$/.test(rest[rest.length-1].trim())) e.duration = rest.pop().trim();
  if (rest.length > 1 && /(bytes|KB|MB|GB|B)$/i.test(rest[rest.length-1].trim())) e.size = rest.pop().trim();
  e.status = rest.join(' · ').trim();

  let section = 'head';
  const bodyBuf = { reqBody: [], resBody: [], error: [] };

  for (let i = 1; i < lines.length; i++){
    const raw = lines[i];
    const t = raw.trim();
    if (SEP.test(t)) continue;
    if (/^Request Headers/.test(t))  { section = 'reqHeaders'; continue; }
    if (/^Response Headers/.test(t)) { section = 'resHeaders'; continue; }
    if (/^Request Body/.test(t))     { section = 'reqBody';    continue; }
    if (/^Response Body/.test(t))    { section = 'resBody';    continue; }
    if (t === 'Error')               { section = 'error';      continue; }

    if (!t){
      if (section === 'reqBody' || section === 'resBody') bodyBuf[section].push('');
      continue;
    }

    switch (section){
      case 'head': {
        /* ✅ FIX: detect URL lines before trying the header regex,
           otherwise "https://host/path" gets parsed as a header named "https". */
        if (!e.url && /^[a-z][a-z0-9+.-]*:\/\//i.test(t)) {
          e.url = t;
          break;
        }
        const kv = t.match(/^([A-Za-z][A-Za-z0-9-]*)\s*:\s*([\s\S]*)$/);
        if (kv && !/^(https?|wss?|file|ftp)$/i.test(kv[1])) {
          e.meta[kv[1]] = kv[2];
        } else if (!e.url)  { e.url = t; }
        else if (!e.task)   { e.task = t; }
        break;
      }
      case 'reqHeaders':
      case 'resHeaders': {
        const idx = t.indexOf(':');
        if (idx > 0) e[section].push([ t.slice(0, idx).trim(), t.slice(idx+1).trim() ]);
        break;
      }
      case 'reqBody': case 'resBody': case 'error':
        bodyBuf[section].push(raw);
        break;
    }
  }

  const clean = arr => { while (arr.length && !arr[0].trim()) arr.shift(); while (arr.length && !arr[arr.length-1].trim()) arr.pop(); return arr.join('\n'); };
  e.reqBody = clean(bodyBuf.reqBody);
  e.resBody = clean(bodyBuf.resBody);
  e.error   = bodyBuf.error.length ? clean(bodyBuf.error) : null;

  const firstLine = e.reqBody.split('\n')[0].trim();
  if (/^(Query|Form|Raw|JSON)$/i.test(firstLine) && e.reqBody.includes('\n')){
    e.reqBodyLabel = firstLine;
    e.reqBody = e.reqBody.slice(e.reqBody.indexOf('\n')+1).replace(/^\n+/, '');
  }

  e.title = titleOf(e.url);
  return e;
}

function parseLog(text){
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const starts = [];
  lines.forEach((l, i) => { if (START.test(l.trim())) starts.push(i); });
  const out = [];
  for (let k = 0; k < starts.length; k++){
    const s = starts[k];
    const en = (k+1 < starts.length) ? starts[k+1] : lines.length;
    try { out.push(parseEntry(lines.slice(s, en), out.length)); }
    catch(err){ console.warn('parse error', err); }
  }
  return out;
}

/* ---------- State ---------- */
let ENTRIES = [], VIEW = [], selected = null, filter = 'all', query = '', titleFilter = '', tab = 'overview';

function renderStats(){
  const total = ENTRIES.length;
  const ok = ENTRIES.filter(e => statusClass(e.status) === 'ok').length;
  const bad = ENTRIES.filter(e => ['warn','err','net'].includes(statusClass(e.status))).length;
  const times = ENTRIES.map(e => durMs(e.duration)).filter(Boolean);
  const avg = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : 0;
  const slow = Math.max(0, ...times);
  $('#stats').innerHTML = `
    <div class="stat"><b>${total}</b><span>Requests</span></div>
    <div class="stat ok"><b>${ok}</b><span>Success</span></div>
    <div class="stat err"><b>${bad}</b><span>Failed</span></div>
    <div class="stat"><b>${avg}<small style="font-size:10px;color:var(--dim)"> ms</small></b><span>Avg time</span></div>
    <div class="stat warn"><b>${slow>=1000?(slow/1000).toFixed(1)+' s':slow+' ms'}</b><span>Slowest</span></div>`;
}

function populateTitleFilter(){
  const sel = $('#titleFilter');
  const titles = [...new Set(ENTRIES.map(e => e.title).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = '<option value="">All titles</option>' + titles.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  if (titleFilter && !titles.includes(titleFilter)) titleFilter = '';
  sel.value = titleFilter;
}

function applyFilters(){
  const q = query.toLowerCase().trim();
  VIEW = ENTRIES.filter(e => {
    const sc = statusClass(e.status);
    if (filter === 'ok'   && sc !== 'ok') return false;
    if (filter === 'warn' && sc !== 'warn') return false;
    if (filter === 'err'  && sc !== 'err') return false;
    if (filter === 'net'  && !['err','net','warn'].includes(sc)) return false;
    if (filter === 'slow' && durMs(e.duration) < 1000) return false;
    if (titleFilter && e.title !== titleFilter) return false;
    if (q){
      const hay = (e.url + ' ' + e.status + ' ' + e.method + ' ' + (e.meta.Host||'') + ' ' + (e.title||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderList(){
  const list = $('#list');
  if (!VIEW.length){
    list.innerHTML = `<div class="empty" style="height:auto;padding:60px 20px"><h2>No matches</h2><p>Try a different filter or search term.</p></div>`;
    return;
  }
  list.innerHTML = `<div class="list-head"><span>${VIEW.length} request${VIEW.length!==1?'s':''}</span><span>${ENTRIES.length} total</span></div>` +
    VIEW.map(e => {
      const sc = statusClass(e.status);
      const title = e.title || shortPath(e.url);
      return `<div class="item${e.id===selected?' sel':''}" data-id="${e.id}">
        <div class="r1">
          <span class="m ${e.method}">${e.method}</span>
          <span class="s ${sc}">${esc(statusCode(e.status))}</span>
          <span class="time">${e.time.slice(0,8)}</span>
        </div>
        <div class="title" title="${esc(title)}">${esc(title)}</div>
        <div class="path">${esc(shortPath(e.url))}</div>
        <div class="r3">
          <span>${esc(e.meta.Host || hostOf(e.url))}</span>
          <span class="sz">${esc(e.size||'')}</span>
          <span class="dur">${esc(fmtDur(e.duration))}</span>
        </div>
      </div>`;
    }).join('');
}

function headersHTML(list){
  if (!list.length) return `<div class="muted">No headers captured.</div>`;
  return `<div class="hdrs">` + list.map(([k,v]) => `<div class="row"><div class="hk">${esc(k)}</div><div class="hv">${esc(v)}</div></div>`).join('') + `</div>`;
}

function bodyHTML(text, label){
  if (!text || !text.trim()) return `<div class="muted">No body.</div>`;
  const obj = tryJSON(text);
  const pretty = obj !== null ? JSON.stringify(obj, null, 2) : text;
  const isJSON = obj !== null;
  const cid = 'c' + Math.random().toString(36).slice(2,9);
  return `<div class="code-wrap"><div class="cw-head"><span>${label||(isJSON?'JSON':'Text')}</span><span style="color:#3d4a5c">·</span><span>${text.length.toLocaleString()} chars</span><button class="copy" data-copy="${cid}">Copy</button></div><pre class="code${isJSON?'':' plain'}" id="${cid}">${isJSON ? highlightJSON(pretty) : esc(text)}</pre></div>`;
}

function formHTML(text){
  const rows = text.split('\n').filter(Boolean).map(line => {
    const i = line.indexOf(':');
    if (i < 0) return `<div class="form-line"><div class="fk"></div><div class="fv">${esc(line)}</div></div>`;
    return `<div class="form-line"><div class="fk">${esc(line.slice(0,i))}</div><div class="fv">${esc(line.slice(i+1).trim())}</div></div>`;
  }).join('');
  return `<div class="code-wrap"><div class="cw-head"><span>Form data</span><button class="copy" data-copy="formblk">Copy</button></div><div id="formblk">${rows}</div></div>`;
}

function reqBodyHTML(e){
  if (!e.reqBody || !e.reqBody.trim()) return `<div class="muted">No request body.</div>`;
  if (e.reqBodyLabel === 'Query' || (!tryJSON(e.reqBody) && e.reqBody.includes('=') && e.reqBody.split('\n').every(l=>!l || l.includes(':'))))
    return formHTML(e.reqBody);
  return bodyHTML(e.reqBody, e.reqBodyLabel || null);
}

function renderDetail(){
  const d = $('#detail');
  const e = ENTRIES.find(x => x.id === selected);
  if (!e){
    d.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><h2>Select a request</h2><p>Pick any entry from the list to inspect its headers, body, timing and error details.</p></div>`;
    return;
  }
  const sc = statusClass(e.status);
  const u = (()=>{ try{ const x=new URL(e.url); return {host:x.host, path:x.pathname+(x.search||'')}; }catch(_){ return {host:'', path:e.url}; } })();

  d.innerHTML = `
    <div class="dhead">
      ${e.title ? `<div class="dtitle">${esc(e.title)}</div>` : ''}
      <div class="durl"><span class="m ${e.method}">${e.method}</span><div class="u"><span class="host">${esc(u.host)}</span><span class="path">${esc(u.path)}</span></div></div>
      <div class="chips">
        <span class="chip ${sc}">${esc(e.status||'—')}</span>
        <span class="chip">⏱ ${esc(fmtDur(e.duration))}</span>
        ${e.size ? `<span class="chip">⇩ ${esc(e.size)}</span>` : ''}
        <span class="chip">${esc(e.time)}</span>
        ${e.task ? `<span class="chip">${esc(e.task)}</span>` : ''}
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="overview" class="${tab==='overview'?'active':''}">Overview</button>
      <button data-tab="request"  class="${tab==='request'?'active':''}">Request <span class="count">${e.reqHeaders.length}</span></button>
      <button data-tab="response" class="${tab==='response'?'active':''}">Response <span class="count">${e.resHeaders.length}</span></button>
      <button data-tab="curl"     class="${tab==='curl'?'active':''}">cURL</button>
    </div>
    <div class="pane ${tab==='overview'?'active':''}" data-pane="overview">${overviewPane(e)}</div>
    <div class="pane ${tab==='request'?'active':''}" data-pane="request">
      <div class="sec"><div class="sec-h"><h3>Request headers</h3><div class="line"></div><button class="copy" data-copyhdr="req">Copy</button></div>${headersHTML(e.reqHeaders)}</div>
      <div class="sec"><div class="sec-h"><h3>Request body</h3><div class="line"></div></div>${reqBodyHTML(e)}</div>
    </div>
    <div class="pane ${tab==='response'?'active':''}" data-pane="response">
      ${e.error ? `<div class="sec"><div class="sec-h"><h3>Error</h3><div class="line"></div></div><div class="code-wrap"><div class="cw-head"><span>NSURLError</span></div><pre class="code plain">${esc(e.error)}</pre></div></div>` : ''}
      <div class="sec"><div class="sec-h"><h3>Response headers</h3><div class="line"></div><button class="copy" data-copyhdr="res">Copy</button></div>${headersHTML(e.resHeaders)}</div>
      <div class="sec"><div class="sec-h"><h3>Response body</h3><div class="line"></div></div>${bodyHTML(e.resBody)}</div>
    </div>
    <div class="pane ${tab==='curl'?'active':''}" data-pane="curl">${curlPane(e)}</div>
  `;

  d.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    d.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
    d.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.dataset.pane === tab));
  }));
  d.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', () => {
    const el = document.getElementById(btn.dataset.copy);
    if (el) navigator.clipboard.writeText(el.innerText).then(()=>flash(btn));
  }));
  d.querySelectorAll('[data-copyhdr]').forEach(btn => btn.addEventListener('click', () => {
    const list = btn.dataset.copyhdr === 'req' ? e.reqHeaders : e.resHeaders;
    navigator.clipboard.writeText(list.map(([k,v]) => k+': '+v).join('\n')).then(()=>flash(btn));
  }));
  const cbtn = d.querySelector('[data-copycurl]');
  if (cbtn) cbtn.addEventListener('click', () => navigator.clipboard.writeText(d.querySelector('#curlblk').innerText).then(()=>flash(cbtn)));
}

function flash(btn){
  const old = btn.textContent;
  btn.textContent = '✓ Copied'; btn.style.color = 'var(--green)';
  setTimeout(()=>{ btn.textContent = old; btn.style.color=''; }, 1200);
}

function overviewPane(e){
  const meta = e.meta || {};
  const rows = Object.keys(meta).map(k => `<div class="row"><div class="hk">${esc(k)}</div><div class="hv">${esc(meta[k])}</div></div>`).join('');
  const ms = durMs(e.duration);
  return `
    <div class="sec"><div class="sec-h"><h3>General</h3><div class="line"></div></div>
      <div class="hdrs">
        ${e.title ? `<div class="row"><div class="hk">Title</div><div class="hv">${esc(e.title)}</div></div>` : ''}
        <div class="row"><div class="hk">URL</div><div class="hv">${esc(e.url)}</div></div>
        <div class="row"><div class="hk">Method</div><div class="hv">${esc(e.method)}</div></div>
        <div class="row"><div class="hk">Status</div><div class="hv">${esc(e.status||'—')}</div></div>
        <div class="row"><div class="hk">Duration</div><div class="hv">${esc(fmtDur(e.duration))}</div></div>
        <div class="row"><div class="hk">Response size</div><div class="hv">${esc(e.size||'—')}</div></div>
        <div class="row"><div class="hk">Task</div><div class="hv">${esc(e.task||'—')}</div></div>
      </div>
    </div>
    ${ms ? `<div class="sec"><div class="sec-h"><h3>Timing</h3><div class="line"></div></div><div class="code-wrap" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;height:8px;border-radius:4px;background:#182130;overflow:hidden"><div style="height:100%;width:${Math.min(100, ms/20)}%;border-radius:4px;background:${ms>3000?'var(--red)':ms>1000?'var(--orange)':'var(--green)'}"></div></div><span style="font-family:var(--mono);font-size:12px;color:var(--muted);min-width:70px;text-align:right">${esc(fmtDur(e.duration))}</span></div></div></div>` : ''}
    ${e.error ? `<div class="sec"><div class="sec-h"><h3>Error</h3><div class="line"></div></div><div class="code-wrap"><pre class="code plain">${esc(e.error)}</pre></div></div>` : ''}
    <div class="sec"><div class="sec-h"><h3>Connection</h3><div class="line"></div></div><div class="hdrs">${rows || '<div class="row"><div class="hv">No metadata</div></div>'}</div></div>
  `;
}

function curlPane(e){
  const parts = [`curl -X ${e.method} '${e.url}'`];
  e.reqHeaders.forEach(([k,v]) => { if (!/^content-length$/i.test(k)) parts.push(`  -H '${k}: ${v.replace(/'/g,"'\\''")}'`); });
  if (e.reqBody && e.reqBody.trim()){
    const one = e.reqBody.replace(/\n/g,' ').replace(/\s+/g,' ');
    parts.push(`  --data-raw '${one.replace(/'/g,"'\\''")}'`);
  }
  return `<div class="sec"><div class="sec-h"><h3>cURL command</h3><div class="line"></div><button class="copy" data-copycurl>Copy</button></div><div class="code-wrap"><div class="cw-head"><span>shell</span></div><pre class="code plain" id="curlblk">${esc(parts.join(' \\\n'))}</pre></div></div>`;
}

function select(id){
  selected = id;
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('sel', +el.dataset.id === id));
  renderDetail();
  const el = document.querySelector('.item.sel');
  if (el) el.scrollIntoView({block:'nearest'});
}

$('#list').addEventListener('click', ev => { const item = ev.target.closest('.item'); if (item) select(+item.dataset.id); });
$('#q').addEventListener('input', ev => { query = ev.target.value; applyFilters(); renderList(); });
$('#filters').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
  applyFilters(); renderList();
});
$('#titleFilter').addEventListener('change', ev => { titleFilter = ev.target.value; applyFilters(); renderList(); });
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  if (!VIEW.length) return;
  ev.preventDefault();
  const idx = VIEW.findIndex(x => x.id === selected);
  let next = ev.key === 'ArrowDown' ? idx+1 : idx-1;
  if (idx === -1) next = 0;
  next = Math.max(0, Math.min(VIEW.length-1, next));
  select(VIEW[next].id);
});

function load(text){
  const entries = parseLog(text);
  if (!entries.length){ alert('No entries found. Make sure the file matches the expected log format.'); return; }
  ENTRIES = entries;
  selected = entries[0].id;
  tab = 'overview';
  titleFilter = '';
  applyFilters();
  renderStats();
  populateTitleFilter();
  renderList();
  renderDetail();
}

$('#loadBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => load(r.result); r.readAsText(f); });

let dragDepth = 0;
window.addEventListener('dragenter', ev => { ev.preventDefault(); dragDepth++; $('#drop').classList.add('on'); });
window.addEventListener('dragover',  ev => ev.preventDefault());
window.addEventListener('dragleave', ev => { dragDepth--; if (dragDepth <= 0){ dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', ev => {
  ev.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  const f = ev.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => load(r.result); r.readAsText(f);
});

load(document.getElementById('sample').textContent);
})();
</script>
</body>
</html>
